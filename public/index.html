<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AMINGO</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--lime:#C7F141;--ink:#0a0a0c;--red:#EA3829;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--ink);font-family:'Rubik',sans-serif;color:#fff;overflow:hidden;}
#app{max-width:430px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;}
#onboard{position:absolute;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;}
#onboard.hidden{display:none;}
#onboard h1{font-family:'Anton',sans-serif;font-size:36px;}
#onboard h1 span{color:var(--red);font-style:italic;}
#onboard .sub{font-size:13px;color:#888;text-align:center;line-height:1.5;}
#onboard input{width:100%;max-width:280px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 18px;font-size:15px;color:#fff;text-align:center;outline:none;}
#onboard input:focus{border-color:var(--lime);}
.ob-btn{width:100%;max-width:280px;background:var(--lime);color:#000;font-family:'Anton',sans-serif;font-size:18px;border:none;padding:16px;border-radius:26px;cursor:pointer;}
#main{position:absolute;inset:0;display:none;flex-direction:column;}
#main.on{display:flex;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex-shrink:0;}
#logo{font-family:'Anton',sans-serif;font-size:20px;}#logo span{color:var(--red);font-style:italic;}
#invite-btn{font-size:11px;color:var(--lime);cursor:pointer;text-decoration:underline;}
#swipe{flex:1;position:relative;overflow:hidden;}
#cards{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.46,.45,.94);will-change:transform;}
.card{flex-shrink:0;width:100%;height:100%;padding:8px 12px;display:flex;flex-direction:column;}
.card-label{font-family:'Anton',sans-serif;font-size:18px;padding:4px 0 8px;display:flex;align-items:center;gap:8px;}

.card-label .cl-share{margin-left:auto;font-size:11px;color:var(--lime);cursor:pointer;font-family:'Rubik',sans-serif;font-weight:600;}
.card-grid{flex:1;display:flex;flex-direction:column;gap:3px;border-radius:18px;overflow:hidden;}
.card-row{flex:1;position:relative;background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card-row video,.card-row img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-row .row-name{position:absolute;bottom:6px;left:8px;font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);z-index:2;}
.card-row .row-sub{position:absolute;bottom:6px;right:8px;font-size:9px;color:rgba(255,255,255,.6);z-index:2;}
.card-row .row-add{position:absolute;top:6px;right:8px;z-index:3;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid var(--lime);color:var(--lime);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.card-row.empty{background:rgba(255,255,255,.03);border:1.5px dashed rgba(255,255,255,.15);cursor:pointer;font-size:28px;color:rgba(255,255,255,.25);}
.card-row.multi{display:flex;flex-direction:row;gap:2px;}
.card-row.multi .sub-cell{flex:1;position:relative;overflow:hidden;}
.card-row.multi .sub-cell video,.card-row.multi .sub-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-row.multi .sub-cell .sc-time{position:absolute;top:3px;right:4px;font-size:8px;color:rgba(255,255,255,.5);z-index:2;}
.card-new{align-items:center;justify-content:center;gap:14px;}
.card-new .cn-btn{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,var(--lime),#51D95F);border:4px solid #000;box-shadow:0 0 0 2.5px var(--lime);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.card-new .cn-inner{width:22px;height:22px;background:#000;border-radius:50%;}
.card-new .cn-text{font-size:13px;color:rgba(255,255,255,.5);text-align:center;}
#dots{display:flex;justify-content:center;gap:6px;padding:8px 0;flex-shrink:0;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;}
.dot.on{background:var(--lime);}
#bottombar{display:flex;align-items:center;justify-content:center;padding:8px 16px 28px;flex-shrink:0;}
#rec-btn{width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,var(--lime),#51D95F);border:4px solid #000;box-shadow:0 0 0 2px var(--lime);display:flex;align-items:center;justify-content:center;cursor:pointer;}
#rec-btn .ri{width:20px;height:20px;background:#000;border-radius:50%;}
#camera{position:absolute;inset:0;z-index:50;background:#000;display:none;flex-direction:column;}
#camera.show{display:flex;}
#cam-stage{flex:1;position:relative;overflow:hidden;}
#cam-stage.recording{box-shadow:inset 0 0 0 4px var(--red);}
#cam-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#cam-fallback{position:absolute;inset:0;background:linear-gradient(160deg,#1a1a2e,#0f3460);display:none;align-items:center;justify-content:center;font-size:80px;opacity:.3;}
#cam-close{position:absolute;top:18px;left:16px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#cam-flip{position:absolute;top:18px;right:16px;z-index:5;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#cam-ghost{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:4;font-family:'Anton',sans-serif;font-size:44px;color:rgba(255,255,255,.12);pointer-events:none;text-align:center;line-height:1.3;opacity:0;}
#cam-ghost.show{animation:ghost 3.5s ease-out forwards;}
@keyframes ghost{0%{opacity:0;transform:translate(-50%,-50%) scale(.85);}12%{opacity:1;transform:translate(-50%,-50%) scale(1);}60%{opacity:1;}100%{opacity:0;}}
#cam-rec{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:6px 14px;border-radius:20px;}
#cam-rec.show{display:flex;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#cam-timer{font-family:'Anton',sans-serif;font-size:16px;}
#cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:14px 28px 34px;display:flex;justify-content:center;align-items:center;gap:36px;z-index:5;background:linear-gradient(transparent,rgba(0,0,0,.55));}
#cam-shutter{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.18);border:none;position:relative;cursor:pointer;}
#cam-shutter::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff;transition:.15s;}
#cam-shutter.rec::after{background:var(--red);inset:20px;border-radius:10px;}
#cam-upload{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
#cam-hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.45);}
#file-input{display:none;}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-60px);z-index:80;background:var(--lime);color:#000;font-size:13px;font-weight:700;padding:10px 20px;border-radius:24px;transition:.35s;opacity:0;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#nudge{position:fixed;top:-70px;left:14px;right:14px;max-width:402px;margin:0 auto;z-index:60;background:#151517;border:2px solid var(--lime);border-radius:18px;padding:10px 14px;font-size:12px;line-height:1.4;transition:top .5s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
#nudge.show{top:14px;}
#nudge b{color:var(--lime);}
#topic-confirm{position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#topic-confirm.show{display:flex;}

#tc-input{background:transparent;border:none;border-bottom:2px solid var(--lime);font-family:'Anton',sans-serif;font-size:26px;color:#fff;text-align:center;padding:8px 4px;width:200px;outline:none;caret-color:var(--lime);}
#tc-hint{font-size:11px;color:rgba(255,255,255,.35);}
#tc-btn{background:var(--lime);color:#000;font-family:'Anton',sans-serif;font-size:16px;border:none;padding:14px 44px;border-radius:24px;cursor:pointer;margin-top:6px;}
#mix-btn{font-size:11px;color:var(--lime);cursor:pointer;font-weight:600;background:rgba(199,241,65,.12);padding:5px 10px;border-radius:10px;margin-right:auto;margin-left:12px;}
#export-preview{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;}
#export-preview.show{display:flex;}
#export-preview video{max-width:100%;max-height:60vh;border-radius:16px;}
.ep-actions{display:flex;gap:12px;}
.ep-btn{padding:12px 24px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;border:none;text-decoration:none;display:inline-block;}
.ep-save{background:var(--lime);color:#000;}
.ep-share{background:#fff;color:#000;}
.ep-close{background:rgba(255,255,255,.12);color:#fff;}
#zoom{position:absolute;inset:0;z-index:75;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;}
#zoom.show{display:flex;}
#zoom video{max-width:100%;max-height:90vh;border-radius:14px;}
</style>
</head>
<body>
<div id="app">
<div id="onboard"><h1>AM<span>I</span>NGO</h1><div class="sub">film 2s clips with your crew<br>same topic, different takes</div><input id="ob-name" placeholder="your name" maxlength="20" autocomplete="off"><button class="ob-btn" id="ob-btn" onclick="startOrJoin()">START A CREW</button></div>
<div id="main"><div id="topbar"><div id="logo">AM<span>I</span>NGO</div><div id="mix-btn" onclick="mixAll()">mix <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle"><path d="M5 3l16 9-16 9z"/></svg></div><div id="invite-btn" onclick="shareCrew()">invite +</div></div><div id="swipe"><div id="cards"></div></div><div id="dots"></div><div id="bottombar"><div id="rec-btn" onclick="openCamera()"><div class="ri"></div></div></div></div>
<div id="camera"><div id="cam-stage"><video id="cam-video" autoplay muted playsinline></video><div id="cam-fallback"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div><div id="cam-ghost"></div></div><div id="cam-close" onclick="closeCamera()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 5l14 14M19 5L5 19"/></svg></div><div id="cam-flip" onclick="flipCamera()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg></div><div id="cam-rec"><div class="rec-dot"></div><div id="cam-timer">0:02</div></div><div id="cam-bottom"><div id="cam-upload" onclick="document.getElementById('file-input').click()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5L5 22"/></svg></div><button id="cam-shutter" onclick="toggleRec()"></button><div style="width:42px"></div></div><div id="cam-hint">tap to film 2s</div><input type="file" id="file-input" accept="video/*"></div>
<div id="nudge" onclick="nudgeTap()"></div>
<div id="export-preview"><video id="ep-video" controls autoplay loop playsinline></video><div class="ep-actions"><button class="ep-btn ep-share" onclick="shareLink()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg> share</button><button id="ep-save" class="ep-btn ep-save" onclick="saveVideo()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/></svg> save</button><button class="ep-btn ep-close" onclick="closeExport()">close</button></div></div>
<div id="topic-confirm"><input id="tc-input" maxlength="20" autocomplete="off" spellcheck="false"><div id="tc-hint">tap name to edit</div><button id="tc-btn" onclick="confirmTopic()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="vertical-align:middle"><path d="M5 13l4 4L19 7"/></svg></button></div>
<div id="zoom"><video id="zoom-video" loop playsinline webkit-playsinline controls></video></div>
<div id="toast"></div>
</div>
<script>
/* ───────── Amingo v2 进度（2026-06-18 全模块化重写）─────────
 * 后端：server.js 薄路由 + store.js(数据/落盘) + vision.js(Claude识别) + video.js(ffmpeg)
 * 视频：spawn 异步转码(H.264/faststart) + 分屏 + drawtext 标题 + 串行锁 + export 只留最近1个
 * 数据：thumb 移出 crews.json，存 thumbs/，仅作 <video> 的 poster 占位
 * 前端：卡片视频一律真播放(vtag)；同卡内所有成员并行播放；切卡暂停离开卡(playOnlyCard，防 iOS 多视频卡死)
 * nudge：带 fromId，按 memberId 判断「自己」(修同名误判)
 * 部署：Dockerfile 去 python/Pillow，装 fonts-dejavu-core(drawtext 字体)
 * 已验证：全路由 curl + 完整流水线(webm转码→2路分屏+标题→导出 1080x1920/h264/2.00s)
 * 待真机：iOS 实机并行播放、autoplay 兜底、drawtext 文字像素
 * ──────────────────────────────────────────────────────── */
let crewId=null,memberId=null,myName='',camStream=null,recorder=null,chunks=[],isRecording=false,recTimer=null,recInterval=null,capturedBlob=null,capturedThumb=null,quickTopic=null,facingMode='user',currentCard=0,pollTimer=null,lastNudgeTs=0,existingCategories=new Set(),lastCardsSig=null;
const saved={c:localStorage.getItem('amingo_crew'),m:localStorage.getItem('amingo_member'),n:localStorage.getItem('amingo_name')};
const joinMatch=location.pathname.match(/^\/join\/(\w+)/);
if(saved.c&&saved.m&&!joinMatch){crewId=saved.c;memberId=saved.m;myName=saved.n||'me';enterApp();}
else if(joinMatch){document.getElementById('ob-btn').textContent='JOIN CREW';fetch('/api/crew/'+joinMatch[1]).then(r=>r.json()).then(d=>{if(d.members)document.querySelector('.sub').textContent=d.members[0].name+"'s crew";}).catch(()=>{});}
function startOrJoin(){myName=document.getElementById('ob-name').value.trim()||'me';const url=joinMatch?'/api/crew/'+joinMatch[1]+'/join':'/api/crew';fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName})}).then(r=>r.json()).then(d=>{if(!d||!d.crewId){toast(d&&d.error?d.error:'crew not found');if(joinMatch)location.href='/';return;}crewId=d.crewId;memberId=d.memberId;localStorage.setItem('amingo_crew',crewId);localStorage.setItem('amingo_member',memberId);localStorage.setItem('amingo_name',myName);enterApp();}).catch(()=>toast('network error'));}
function enterApp(){document.getElementById('onboard').classList.add('hidden');document.getElementById('main').classList.add('on');lastNudgeTs=Date.now();refreshCards();pollTimer=setInterval(()=>{refreshCards();checkNudges();},4000);}
function shareCrew(){const u=location.origin+'/join/'+crewId;navigator.clipboard.writeText(u).then(()=>toast('invite link copied!')).catch(()=>prompt('Share:',u));}

// HTML 转义（XSS 双保险；后端已清洗 name/category，这里再防御历史脏数据）
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
// 主题名→稳定 key（与后端 store.catKey 一致），用于 stitch 索引
function catKey(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
// 卡片视频一律真播放：thumbUrl 仅作 poster 占位；点击全屏放大(zoomVideo)
function vtag(c){return '<video src="'+c.videoUrl+'"'+(c.thumbUrl?' poster="'+c.thumbUrl+'"':'')+' autoplay muted loop playsinline webkit-playsinline preload="metadata" onclick="zoomVideo(event,this)" style="cursor:pointer"></video>';}
function refreshCards(){
if(!crewId)return;
fetch('/api/crew/'+crewId).then(r=>{if(!r.ok){localStorage.clear();location.reload();return null;}return r.json();}).then(data=>{
if(!data)return;
const members=data.members,grouped={},moments=[],stitches=data.stitches||{};
data.clips.forEach(c=>{if(c.category)(grouped[c.category]=grouped[c.category]||{clips:[]}).clips.push(c);else moments.push(c);});
existingCategories=new Set(Object.keys(grouped).map(k=>k.toLowerCase()));
// 渲染签名：成员/clip/拼接 真变化才重建 DOM；否则跳过，避免每 4s 轮询重建视频元素导致黑屏卡顿
const sig=members.map(m=>m.id+':'+m.name).join(',')+'|'+data.clips.map(c=>c.id+c.memberId+(c.category||'')+c.videoUrl).join(',')+'|'+JSON.stringify(stitches);
if(sig===lastCardsSig)return; // 无变化：保持现有视频继续播放
lastCardsSig=sig;
const container=document.getElementById('cards');
let html='';
Object.entries(grouped).forEach(([cat,{clips}])=>{
  const byMember={};
  clips.forEach(c=>(byMember[c.memberName]=byMember[c.memberName]||[]).push(c));
  html+='<div class="card"><div class="card-label">'+esc(cat)+'<span class="cl-share" onclick="shareCard(\''+cat+'\')">share</span></div><div class="card-grid">';
  members.forEach(m=>{
    const mc=(byMember[m.name]||[]).slice().sort((a,b)=>a.ts-b.ts);
    if(!mc.length){
      html+=m.id===memberId?'<div class="card-row empty" onclick="filmForTopic(\''+cat+'\')">+</div>':'<div class="card-row empty"><span style="font-size:12px;color:rgba(255,255,255,.2)">'+esc(m.name)+'</span></div>';
    }else{
      // 同人同主题：≥2 条用后端拼接视频，否则单条；本人且不足 3 条时格子角标可加拍
      const c=mc[mc.length-1];
      const vurl=stitches[m.id+'|'+catKey(cat)]||c.videoUrl;
      const mine=c.memberId===memberId;
      const addBtn=(mine&&mc.length<3)?'<div class="row-add" onclick="event.stopPropagation();filmForTopic(\''+cat+'\')">+</div>':'';
      html+='<div class="card-row">'+vtag({videoUrl:vurl,thumbUrl:c.thumbUrl})+'<div class="row-name">'+(mine?'you':esc(c.memberName))+'</div><div class="row-sub">'+timeAgo(c.ts)+'</div>'+addBtn+'</div>';
    }
  });
  html+='</div></div>';
});
if(moments.length){
  html+='<div class="card"><div class="card-label">Moments</div><div class="card-grid">';
  moments.forEach(c=>{html+='<div class="card-row">'+vtag(c)+'<div class="row-name">'+(c.memberId===memberId?'you':esc(c.memberName))+'</div><div class="row-sub">'+timeAgo(c.ts)+'</div></div>';});
  html+='</div></div>';
}
html+='<div class="card card-new"><div class="cn-btn" onclick="openCamera()"><div class="cn-inner"></div></div><div class="cn-text">film something new</div></div>';
container.innerHTML=html;
const n=container.children.length;container.style.width=(n*100)+'%';
Array.from(container.children).forEach(c=>c.style.width=(100/n)+'%');
const dots=document.getElementById('dots');dots.innerHTML='';
for(let i=0;i<n;i++){const d=document.createElement('div');d.className='dot'+(i===currentCard?' on':'');d.onclick=()=>goCard(i);dots.appendChild(d);}
goCard(Math.min(currentCard,n-1));
});
}
function goCard(i){currentCard=i;const c=document.getElementById('cards'),n=c.children.length;if(!n)return;c.style.transform='translateX(-'+(i*(100/n))+'%)';document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===i));playOnlyCard(i);}
// 只播当前卡（卡内所有成员视频并行播放）；离开的卡暂停，防 iOS 多视频卡死
function playOnlyCard(i){const cards=document.getElementById('cards').children;for(let j=0;j<cards.length;j++){cards[j].querySelectorAll('video').forEach(v=>{if(j===i){const p=v.play();if(p&&p.catch)p.catch(()=>{});}else{v.pause();}});}}
let sx=null;
document.getElementById('swipe').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
document.getElementById('swipe').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,n=document.getElementById('cards').children.length;if(dx<-50&&currentCard<n-1)goCard(currentCard+1);else if(dx>50&&currentCard>0)goCard(currentCard-1);sx=null;});
function filmForTopic(c){quickTopic={name:c};openCamera();}
async function shareCard(cat){
toast('exporting '+cat+'...');
try{const r=await fetch('/api/crew/'+crewId+'/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:cat})});const d=await r.json();if(d.error){toast(d.error);return;}showExport(d.videoUrl);}catch(e){toast('export failed');}
}
async function mixAll(){
toast('mixing all topics...');
try{const r=await fetch('/api/crew/'+crewId+'/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});const d=await r.json();if(d.error){toast(d.error);return;}showExport(d.videoUrl);}catch(e){toast('export failed');}
}
let lastExportUrl=null;
function showExport(url){lastExportUrl=url;document.getElementById('ep-video').src=url;document.getElementById('export-preview').classList.add('show');}
// 保存到相册：iOS 不支持 <a download>，改用 navigator.share 分享视频文件(面板里「存储视频」存相册)；桌面退回 blob 下载
async function saveVideo(){
  if(!lastExportUrl)return;
  const url=location.origin+lastExportUrl;
  try{
    const blob=await (await fetch(url)).blob();
    const file=new File([blob],'amingo.mp4',{type:'video/mp4'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='amingo.mp4';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){toast('保存失败，可长按视频存相册');}
}
function closeExport(){document.getElementById('export-preview').classList.remove('show');document.getElementById('ep-video').src='';}
// 分享：直链 = 当前导出视频的绝对地址，对方打开即播放/下载。优先系统分享面板，桌面端兜底复制
function shareLink(){if(!lastExportUrl)return;const url=location.origin+lastExportUrl;if(navigator.share){navigator.share({url}).catch(()=>{});}else{navigator.clipboard.writeText(url).then(()=>toast('link copied!')).catch(()=>prompt('share:',url));}}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';}

async function openCamera(){
document.getElementById('camera').classList.add('show');
const g=document.getElementById('cam-ghost');
if(quickTopic){g.textContent=quickTopic.name;g.classList.remove('show');void g.offsetWidth;g.classList.add('show');}
else{g.textContent='';g.classList.remove('show');}
try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:true});document.getElementById('cam-video').srcObject=camStream;document.getElementById('cam-video').style.display='block';document.getElementById('cam-video').style.transform=facingMode==='user'?'scaleX(-1)':'none';document.getElementById('cam-fallback').style.display='none';}
catch(e){document.getElementById('cam-video').style.display='none';document.getElementById('cam-fallback').style.display='flex';}
}
function closeCamera(){if(recorder&&recorder.state!=='inactive')try{recorder.stop();}catch(e){}isRecording=false;clearTimeout(recTimer);clearInterval(recInterval);document.getElementById('cam-shutter').classList.remove('rec');document.getElementById('cam-rec').classList.remove('show');document.getElementById('cam-stage').classList.remove('recording');document.getElementById('cam-hint').textContent='tap to film 2s';if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}document.getElementById('camera').classList.remove('show');}
function flipCamera(){facingMode=facingMode==='user'?'environment':'user';if(camStream)camStream.getTracks().forEach(t=>t.stop());navigator.mediaDevices.getUserMedia({video:{facingMode},audio:true}).then(s=>{camStream=s;document.getElementById('cam-video').srcObject=s;document.getElementById('cam-video').style.transform=facingMode==='user'?'scaleX(-1)':'none';}).catch(()=>{});}
function toggleRec(){if(!camStream)return;if(!isRecording){isRecording=true;chunks=[];document.getElementById('cam-shutter').classList.add('rec');document.getElementById('cam-rec').classList.add('show');document.getElementById('cam-stage').classList.add('recording');document.getElementById('cam-hint').textContent='filming...';let secs=2;document.getElementById('cam-timer').textContent='0:0'+secs;recInterval=setInterval(()=>{secs--;document.getElementById('cam-timer').textContent='0:0'+Math.max(0,secs);},1000);try{recorder=new MediaRecorder(camStream);}catch(e){recorder=new MediaRecorder(camStream,{mimeType:'video/webm'});}recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=()=>{capturedBlob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});processCapture();};recorder.start(100);recTimer=setTimeout(()=>{isRecording=false;clearInterval(recInterval);document.getElementById('cam-shutter').classList.remove('rec');document.getElementById('cam-rec').classList.remove('show');document.getElementById('cam-stage').classList.remove('recording');if(recorder&&recorder.state!=='inactive')recorder.stop();},2000);}}
document.getElementById('file-input').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f){capturedBlob=f;processCapture();}});

function processCapture(){
closeCamera();if(!capturedBlob)return;
if(quickTopic){uploadClip(quickTopic.name);quickTopic=null;return;}
const url=URL.createObjectURL(capturedBlob);
const vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.autoplay=true;
let done=false;
const finish=fn=>{if(done)return;done=true;URL.revokeObjectURL(url);fn();}; // 用完即释放，杜绝 blob URL 泄漏
vid.onloadeddata=()=>{setTimeout(()=>{if(done)return;let ok=false;try{const c=document.createElement('canvas');c.width=vid.videoWidth||320;c.height=vid.videoHeight||240;c.getContext('2d').drawImage(vid,0,0);capturedThumb=c.toDataURL('image/jpeg',0.5);vid.pause();ok=true;}catch(e){}finish(()=>{if(!ok){uploadClip(null);return;}fetch('/api/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:capturedThumb})}).then(r=>r.json()).then(r=>{if(!r.label){uploadClip(null);return;}if(existingCategories.has(r.label.toLowerCase())){uploadClip(r.label);}else{showTopicConfirm(r.label);}}).catch(()=>uploadClip(null));});},300);};
vid.onerror=()=>finish(()=>uploadClip(null));
vid.src=url;
setTimeout(()=>finish(()=>uploadClip(null)),5000);
}

async function uploadClip(category){
if(!capturedBlob)return;
if(!crewId||!memberId){toast('not in a crew, reopening...');capturedBlob=null;capturedThumb=null;localStorage.clear();setTimeout(()=>location.href='/',800);return;} // crewId 失效兜底，别把 clip 传到 undefined
const form=new FormData();
// blob 类型可能为空(浏览器/编码器差异)，强制包成带 video 类型的 File，保证上传分片 Content-Type 是 video/webm
const vblob=(capturedBlob.type||'').startsWith('video/')?capturedBlob:new File([capturedBlob],'clip.webm',{type:'video/webm'});
form.append('clip',vblob,'clip.webm');form.append('memberId',memberId);form.append('thumb',capturedThumb||'');
if(category){form.append('category',category);}
try{await fetch('/api/crew/'+crewId+'/clip',{method:'POST',body:form});
if(category){await fetch('/api/crew/'+crewId+'/nudge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({memberId,category})});toast(category+' saved');}
else toast('saved');
}catch(e){toast('upload failed');}
capturedBlob=null;capturedThumb=null;setTimeout(refreshCards,500);
}

function showTopicConfirm(label){
const inp=document.getElementById('tc-input');inp.value=label;
document.getElementById('topic-confirm').classList.add('show');
}
function confirmTopic(){
const el=document.getElementById('topic-confirm');if(!el.classList.contains('show'))return;
el.classList.remove('show');
const name=document.getElementById('tc-input').value.trim()||'Moments';
if(name==='Moments'){uploadClip(null);}
else{uploadClip(name);}
}
function checkNudges(){if(!crewId)return;fetch('/api/crew/'+crewId+'/nudges?since='+lastNudgeTs).then(r=>r.json()).then(d=>{if(!d.nudges||!d.nudges.length)return;const n=d.nudges[d.nudges.length-1];lastNudgeTs=n.ts;if(n.fromId===memberId)return;document.getElementById('nudge').innerHTML='<b>'+n.fromName+'</b> filmed <b>'+(n.category||'something')+'</b> — wants to see yours!';document.getElementById('nudge').classList.add('show');setTimeout(()=>document.getElementById('nudge').classList.remove('show'),4000);});}
function nudgeTap(){document.getElementById('nudge').classList.remove('show');openCamera();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
// 点 clip 全屏放大播放，点背景关闭
function zoomVideo(ev,v){ev.stopPropagation();const zv=document.getElementById('zoom-video');zv.src=v.currentSrc||v.src;document.getElementById('zoom').classList.add('show');const p=zv.play();if(p&&p.catch)p.catch(()=>{});}
document.getElementById('zoom').addEventListener('click',e=>{if(e.target.id==='zoom'){e.currentTarget.classList.remove('show');document.getElementById('zoom-video').src='';}});
// 主题确认浮层：回车确认；点背景空白 = 关闭并归 Moments(不丢素材)
document.getElementById('tc-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirmTopic();}});
document.getElementById('topic-confirm').addEventListener('click',e=>{if(e.target.id==='topic-confirm'){e.currentTarget.classList.remove('show');uploadClip(null);}});
// autoplay 兜底：首次用户手势解锁当前卡播放(iOS)
document.addEventListener('click',()=>playOnlyCard(currentCard),{once:true});
document.addEventListener('touchstart',()=>playOnlyCard(currentCard),{once:true,passive:true});
</script>
